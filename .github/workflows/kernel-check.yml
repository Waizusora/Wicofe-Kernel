name: Kernel foundation checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Rust checks and QEMU boot
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Checkout pinned Wicofe dependency auditor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Waizusora/Wicofe-Tools
          ref: cccc4c197687ce8fd629f9b9d8a7d95d4e89cddc
          path: Wicofe-Tools
      - name: Install system tools and capture package delta
        id: install-tools
        run: |
          mkdir -p target/ci-audit
          dpkg-query -W -f='${binary:Package}\t${Version}\n' | sort > target/ci-audit/packages.before.tsv
          sudo apt-get update
          sudo apt-get install --yes \
            clang-22=1:22.1.2-1ubuntu1 \
            llvm-22-tools=1:22.1.2-1ubuntu1 \
            qemu-system-x86=1:10.2.1+ds-1ubuntu3.3 \
            xorriso=1:1.5.6-1.1ubuntu4
          dpkg-query -W -f='${binary:Package}\t${Version}\n' | sort > target/ci-audit/packages.after.tsv
          python3 - <<'PY'
          from pathlib import Path
          def read(path):
              return dict(line.rstrip().split("\t", 1) for line in Path(path).read_text().splitlines() if "\t" in line)
          before = read("target/ci-audit/packages.before.tsv")
          after = read("target/ci-audit/packages.after.tsv")
          with Path("target/ci-audit/packages.changed.tsv").open("w") as out:
              for name, version in sorted(after.items()):
                  if before.get(name) != version:
                      out.write(f"{name}\t{before.get(name, 'NEW')}\t{version}\n")
          PY
          {
            cat /etc/os-release
            uname -a
            clang-22 --version | head -n 1
            llvm-readelf-22 --version | head -n 1
            curl --version | head -n 1
            xorriso -version | head -n 1
            qemu-system-x86_64 --version | head -n 1
            echo "ImageOS=${ImageOS:-}" 
            echo "ImageVersion=${ImageVersion:-}"
          } > target/ci-audit/runner-tools.txt
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          packages = {}
          for tool in ("clang-22", "llvm-readelf-22", "curl", "xorriso", "qemu-system-x86_64"):
              executable = subprocess.run(["which", tool], capture_output=True, text=True).stdout.strip()
              if not executable:
                  continue
              owner = subprocess.run(["dpkg-query", "-S", executable], capture_output=True, text=True).stdout.splitlines()
              if not owner:
                  continue
              package = owner[0].split(": ", 1)[0].split(":", 1)[0]
              version = subprocess.run(["dpkg-query", "-W", "-f=${Version}", package],
                                       capture_output=True, text=True).stdout.strip()
              if version:
                  packages[package] = version
          existing = {line.split("\t", 1)[0] for line in
                      Path("target/ci-audit/packages.changed.tsv").read_text().splitlines() if "\t" in line}
          with Path("target/ci-audit/packages.changed.tsv").open("a") as out:
              for package, version in sorted(packages.items()):
                  if package not in existing:
                      out.write(f"{package}\tPREINSTALLED\t{version}\n")
          PY
      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable source commit
        with:
          toolchain: 1.100.0
          targets: x86_64-unknown-none,aarch64-unknown-none
          components: rustfmt
      - name: Record pinned Rust toolchain
        run: |
          rustc --version >> target/ci-audit/runner-tools.txt
          cargo --version >> target/ci-audit/runner-tools.txt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run unit tests
        run: cargo test --workspace
      - name: Check x86-64 target
        run: cargo check --workspace --target x86_64-unknown-none
      - name: Build x86-64 kernel ELF
        run: |
          cargo build -p wicofe-kernel --features kernel-image --bin wicofe-kernel --target x86_64-unknown-none
          llvm-readelf-22 -h target/x86_64-unknown-none/debug/wicofe-kernel
          llvm-readelf-22 -l target/x86_64-unknown-none/debug/wicofe-kernel
          python3 scripts/verify_kernel_elf.py target/x86_64-unknown-none/debug/wicofe-kernel
      - name: Build Limine ISO
        run: scripts/build_limine_iso.sh target/wicofe-x86_64.iso
      - name: Audit installed system package licenses
        if: always() && steps.install-tools.outcome == 'success'
        run: |
          python3 Wicofe-Tools/scripts/audit_dpkg_packages.py \
            --packages target/ci-audit/packages.changed.tsv \
            --repository Wicofe-Kernel \
            --json target/ci-audit/system-packages.json \
            --markdown target/ci-audit/system-packages.md
      - name: Verify ISO license notices
        run: |
          xorriso -indev target/wicofe-x86_64.iso -ls /boot/limine/licenses/limine-12.9.6 | tee target/ci-audit/iso-notices.txt
          grep -Fq "COPYING" target/ci-audit/iso-notices.txt
          grep -Fq "3RDPARTY.md" target/ci-audit/iso-notices.txt
          grep -Fq "LICENSE" target/ci-audit/iso-notices.txt
          python3 - target/wicofe-x86_64.iso target/wicofe-x86_64.iso.sha256 <<'PY'
          import hashlib
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          Path(sys.argv[2]).write_text(f"{digest}  {path.name}\n", encoding="utf-8")
          PY
      - name: Boot kernel in QEMU
        run: |
          set +e
          timeout 20s qemu-system-x86_64 \
            -machine q35 -m 512M -cdrom target/wicofe-x86_64.iso -boot d \
            -display none -serial file:target/qemu-serial.log \
            -no-reboot -no-shutdown
          qemu_status=$?
          set -e
          if [[ "$qemu_status" -ne 124 && "$qemu_status" -ne 0 ]]; then
            echo "QEMU exited unexpectedly with status $qemu_status"
            cat target/qemu-serial.log || true
            exit "$qemu_status"
          fi
          cat target/qemu-serial.log
          grep -Fq "WICOFE: PMM_READY" target/qemu-serial.log
          grep -Fq "WICOFE: PMM_ALLOC_FREE_OK" target/qemu-serial.log
          if grep -Eq "WICOFE: (BOOTINFO_INVALID|PMM_INIT_FAILED|PMM_ALLOC_FREE_FAILED|BOOT_FAILED)" target/qemu-serial.log; then
            echo "Kernel reported a bootstrap failure"
            exit 1
          fi
      - name: Check AArch64 target
        run: cargo check --workspace --target aarch64-unknown-none
      - name: Upload kernel build and license evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wicofe-kernel-build-evidence
          path: |
            target/wicofe-x86_64.iso
            target/wicofe-x86_64.iso.sha256
            target/qemu-serial.log
            target/ci-audit/
          if-no-files-found: warn
