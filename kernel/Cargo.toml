[package]
name = "wicofe-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WICOFE monolithic kernel foundation"

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "wicofe-kernel"
path = "src/main.rs"
required-features = ["kernel-image"]
test = false
bench = false

[features]
default = []
kernel-image = []
exception-smoke-int3 = []
exception-smoke-ud2 = []
exception-smoke-page-fault = []
exception-smoke-double-fault = []

[lints]
workspace = true
